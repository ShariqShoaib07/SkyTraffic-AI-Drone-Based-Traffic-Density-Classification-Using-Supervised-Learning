{% extends 'base.html' %}

{% block title %}Analyze - SkyTraffic AI{% endblock %}

{% block content %}
<div class="analyze-container">
    <div class="analyze-left">
        <h2>Upload Image</h2>
        <div class="upload-controls">
            <input type="file" id="fileInput" class="file-input" accept="image/*">
            <button type="button" class="choose-image-btn" id="chooseImageBtn">Choose Image</button>
            <span class="selected-file-name" id="selectedFileName">No image selected</span>
        </div>
        <div class="preview-box" id="previewBox">
            <img id="imagePreview" src="" alt="Selected image preview" class="image-preview" style="display: none;">
            <div class="preview-placeholder" id="previewPlaceholder">Preview</div>
        </div>
        <button type="button" class="analyze-btn" id="analyzeBtn" disabled>Analyze Traffic</button>

        <h3 style="margin-top: 40px; margin-bottom: 20px;">Sample Images</h3>
        <div class="sample-images">
            <img src="/static/sample_images/sample_1.jpg" alt="Sample 1" class="sample-thumb" data-sample="sample_1">
            <img src="/static/sample_images/sample_2.jpg" alt="Sample 2" class="sample-thumb" data-sample="sample_2">
            <img src="/static/sample_images/sample_3.jpg" alt="Sample 3" class="sample-thumb" data-sample="sample_3">
            <img src="/static/sample_images/sample_4.jpg" alt="Sample 4" class="sample-thumb" data-sample="sample_4">
            <img src="/static/sample_images/sample_5.jpg" alt="Sample 5" class="sample-thumb" data-sample="sample_5">
            <img src="/static/sample_images/sample_6.jpg" alt="Sample 6" class="sample-thumb" data-sample="sample_6">
        </div>
    </div>

    <div class="analyze-right" id="resultsPanel" style="display: none;">
        <div class="loading" id="loadingSpinner">
            <div class="spinner"></div>
            <p>Analyzing...</p>
        </div>

        <div id="resultsContent" style="display: none;">
            <div class="results-image-container">
                <img id="annotatedImage" src="" alt="Annotated Image" class="annotated-image">
            </div>

            <div class="traffic-badge" id="trafficBadge">
                <span class="badge-label">Traffic Density</span>
                <span class="badge-value" id="densityValue">--</span>
            </div>

            <div class="vehicle-counts">
                <div class="count-card">
                    <div class="count-label">Total Vehicles</div>
                    <div class="count-value" id="totalCount">0</div>
                </div>
                <div class="count-card">
                    <div class="count-label">🚗 Cars</div>
                    <div class="count-value" id="carCount">0</div>
                </div>
                <div class="count-card">
                    <div class="count-label">🚚 Trucks</div>
                    <div class="count-value" id="truckCount">0</div>
                </div>
            </div>

            <div class="predictions-section">
                <h3>Model Predictions</h3>
                <div class="predictions-grid" id="predictionsGrid">
                    <!-- Filled by JS -->
                </div>
                <div class="linear-regression">
                    <p><strong>Predicted Vehicle Count:</strong> <span id="lrCount">--</span></p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.analyze-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    margin-bottom: 60px;
}

@media (max-width: 1200px) {
    .analyze-container {
        grid-template-columns: 1fr;
    }
}

.analyze-left, .analyze-right {
    background: #1a1d27;
    border: 1px solid #2a2d3e;
    border-radius: 12px;
    padding: 30px;
}

.analyze-left h2 {
    margin-top: 0;
    color: #e2e8f0;
    margin-bottom: 20px;
}

.analyze-left h3 {
    color: #8892a4;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 0;
}

.upload-controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.file-input {
    display: none;
}

.choose-image-btn,
.analyze-btn {
    background: #00d4aa;
    color: #07110f;
    border: 0;
    border-radius: 8px;
    padding: 12px 20px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease, opacity 0.2s ease;
}

.choose-image-btn:hover,
.analyze-btn:hover:not(:disabled) {
    background: #00b995;
    transform: translateY(-1px);
}

.analyze-btn {
    width: 100%;
    margin-top: 18px;
}

.analyze-btn:disabled {
    cursor: not-allowed;
    opacity: 0.45;
}

.selected-file-name {
    color: #8892a4;
    font-size: 0.9rem;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.preview-box {
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #0f1117;
    border: 1px solid #2a2d3e;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.image-preview {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #0f1117;
}

.preview-placeholder {
    color: #8892a4;
    font-weight: 600;
}

.upload-area {
    border: 2px dashed #00d4aa;
    border-radius: 8px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    background: rgba(0, 212, 170, 0.05);
}

.upload-area:hover {
    border-color: #00a399;
    background: rgba(0, 212, 170, 0.1);
}

.upload-area.dragover {
    border-color: #ff4757;
    background: rgba(255, 71, 87, 0.1);
}

.upload-icon {
    font-size: 3rem;
    margin-bottom: 15px;
}

.upload-text {
    color: #e2e8f0;
    font-size: 1.1rem;
    font-weight: 500;
    margin: 0 0 5px 0;
}

.upload-subtext {
    color: #8892a4;
    font-size: 0.9rem;
    margin: 0;
}

.file-input {
    display: none;
}

.sample-images {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.sample-thumb {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid #2a2d3e;
    cursor: pointer;
    transition: all 0.3s ease;
    opacity: 0.7;
}

.sample-thumb:hover {
    border-color: #00d4aa;
    opacity: 1;
    transform: scale(1.05);
}

.loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
}

.spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #2a2d3e;
    border-top-color: #00d4aa;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-bottom: 20px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading p {
    color: #8892a4;
    margin: 0;
}

#resultsContent {
    animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.results-image-container {
    margin-bottom: 30px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #2a2d3e;
}

.annotated-image {
    width: 100%;
    height: auto;
    display: block;
}

.traffic-badge {
    background: linear-gradient(135deg, #2ed573 0%, #00a388 100%);
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    margin-bottom: 30px;
    color: white;
}

.traffic-badge.medium {
    background: linear-gradient(135deg, #ffa502 0%, #ff8c00 100%);
}

.traffic-badge.high {
    background: linear-gradient(135deg, #ff4757 0%, #ff1744 100%);
}

.badge-label {
    display: block;
    font-size: 0.9rem;
    opacity: 0.9;
    margin-bottom: 5px;
}

.badge-value {
    display: block;
    font-size: 2.5rem;
    font-weight: 700;
}

.vehicle-counts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.count-card {
    background: #0f1117;
    border: 1px solid #2a2d3e;
    border-radius: 8px;
    padding: 15px;
    text-align: center;
}

.count-label {
    color: #8892a4;
    font-size: 0.85rem;
    margin-bottom: 8px;
}

.count-value {
    color: #00d4aa;
    font-size: 1.8rem;
    font-weight: 700;
}

.predictions-section {
    margin-top: 30px;
}

.predictions-section h3 {
    color: #e2e8f0;
    margin: 0 0 15px 0;
    font-size: 1rem;
}

.predictions-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

@media (max-width: 800px) {
    .predictions-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

.prediction-badge {
    background: #0f1117;
    border: 1px solid #2a2d3e;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    font-size: 0.85rem;
}

.prediction-model {
    color: #8892a4;
    font-size: 0.75rem;
    margin-bottom: 5px;
}

.prediction-value {
    color: #00d4aa;
    font-weight: 600;
}

.linear-regression {
    background: #0f1117;
    border: 1px solid #2a2d3e;
    border-radius: 8px;
    padding: 15px;
    color: #e2e8f0;
}

.linear-regression p {
    margin: 0;
}
</style>
{% endblock %}
